<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ride Replay</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  html, body { margin: 0; height: 100%; font: 14px/1.4 -apple-system, system-ui, sans-serif; background: #111; color: #eee; }
  #map { position: absolute; inset: 0 0 268px 0; }
  #panel { position: absolute; left: 0; right: 0; bottom: 0; height: 268px; background: #1b1b1b; border-top: 1px solid #333; padding: 10px 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px; }
  #profile { width: 100%; height: 100px; display: block; cursor: crosshair; }
  #scrub { width: 100%; margin: 0; }
  .row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .stats { display: flex; gap: 18px; margin-left: auto; font-variant-numeric: tabular-nums; }
  .stats span b { color: #8ab4f8; font-weight: 600; display: inline-block; text-align: right; }
  #clock { width: 8.5ch; } #elapsed { width: 6.5ch; } #dist { width: 8ch; } #spd { width: 8ch; } #pwr { width: 6ch; } #ele { width: 7ch; }
  #cad { width: 7ch; } #grade { width: 6ch; } #gsent { width: 6ch; } #gap { width: 15ch; }
  button, select, input[type=text] { background: #2a2a2a; color: #eee; border: 1px solid #444; border-radius: 6px; padding: 5px 12px; font: inherit; }
  button, select { cursor: pointer; } button:hover, select:hover { background: #333; }
  button:disabled { opacity: .4; cursor: default; }
  input[type=text] { padding: 4px 6px; width: 4ch; text-align: center; font-variant-numeric: tabular-nums; }
  input.wide { width: 6ch; }
  label { display: flex; align-items: center; gap: 5px; cursor: pointer; }
  #title { font-weight: 600; color: #bbb; }
  #status, #kstatus { color: #8ab4f8; }
  #status { margin-left: auto; }
  .leaflet-container { background: #0d0d0d; }
  .riding #dot-hint { display: inline; }
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <canvas id="profile"></canvas>
  <input id="scrub" type="range" min="0" max="1000000" value="0" step="1">
  <div class="row">
    <button id="play">Play</button>
    <select id="speed">
      <option value="1">1x</option><option value="2">2x</option><option value="5">5x</option>
      <option value="10" selected>10x</option><option value="30">30x</option><option value="100">100x</option><option value="300">300x</option>
    </select>
    <label><input id="trail" type="checkbox" checked> Trail</label>
    <label><input id="route" type="checkbox" checked> Full route</label>
    <label><input id="skip" type="checkbox" checked> Skip stops</label>
    <label><input id="follow" type="checkbox"> Follow</label>
    <div class="stats">
      <span>Clock <b id="clock">–</b></span>
      <span>Elapsed <b id="elapsed">–</b></span>
      <span>Dist <b id="dist">–</b></span>
      <span>Speed <b id="spd">–</b></span>
      <span>Power <b id="pwr">–</b></span>
      <span>Elev <b id="ele">–</b></span>
    </div>
  </div>
  <div class="row">
    <span id="title"></span>
    <button id="load">Load file</button>
    <input id="file" type="file" accept=".gpx,.tcx,.fit" hidden>
    <button id="fixdrift">Fix elevation drift</button>
    <button id="level">Level start/end</button>
    <button id="resetele">Reset elevation</button>
    <button id="markA" title="[">Mark start</button>
    <button id="markB" title="]">Mark end</button>
    <button id="crop" disabled>Crop</button>
    <button id="unstop" title="Replace short stops (lights, signs) with the speed held before braking; later times shift earlier">Remove stops</button>
    <label>≤ <input id="maxstop" type="text" value="120"> s</label>
    <label title="Stops at least this long are marked on the profile; click one to snap, , and . jump between them">Stops ≥ <input id="minstop" type="text" value="60"> s</label>
    <input id="exportname" type="text" class="wide" style="width:22ch;text-align:left" placeholder="file name">
    <button id="export">Export GPX</button>
    <span id="status"></span>
  </div>
  <div class="row">
    <button id="connect">Connect Kickr</button>
    <button id="ridebtn" disabled>Start ride</button>
    <button id="finish" disabled>Finish ride</button>
    <label title="Gear physically on the trainer bike">Bike <input id="tRing" type="text" value="39">/<input id="tCog" type="text" value="14"></label>
    <label title="Gear to mimic">Mimic <input id="fRing" type="text" value="49">/<input id="fCog" type="text" value="18"></label>
    <label title="Wheel circumference, mm">Wheel <input id="wheel" type="text" class="wide" value="2105"></label>
    <label title="Rolling resistance coefficient">Crr <input id="crr" type="text" class="wide" value="0.004"></label>
    <label title="Wind resistance coefficient, kg/m">Cw <input id="cw" type="text" class="wide" value="0.25"></label>
    <label><input id="ghostck" type="checkbox" checked> Ghost</label>
    <label>Speed from <select id="spdsrc"><option value="cadence">cadence (fixed gear)</option><option value="trainer">trainer</option></select></label>
    <button id="exportride" disabled>Export ride TCX</button>
    <div class="stats">
      <span>Cad <b id="cad">–</b></span>
      <span>Grade <b id="grade">–</b></span>
      <span>Sent <b id="gsent">–</b></span>
      <span>Gap <b id="gap">–</b></span>
    </div>
    <span id="kstatus"></span>
  </div>
</div>

    const data = await srv.getCharacteristic(0x2ad2);
    await data.startNotifications();
    data.addEventListener('characteristicvaluechanged', onBikeData);
    cp = await srv.getCharacteristic(0x2ad9);
    await cp.startNotifications();
    cp.addEventListener('characteristicvaluechanged', e => {
      const v = e.target.value;
      if (v.getUint8(0) === 0x80 && v.getUint8(2) !== 1) kstatus(`Trainer rejected op 0x${v.getUint8(1).toString(16)} (result ${v.getUint8(2)})`);
    });
    await cpWrite(Uint8Array.of(0x00));
    await cpWrite(Uint8Array.of(0x07));
    $('connect').textContent = 'Disconnect'; $('ridebtn').disabled = false;
    kstatus(`Connected to ${device.name || 'trainer'}`);
  } catch (err) { device = null; kstatus(err.name === 'NotFoundError' ? 'No device chosen' : 'Connect failed: ' + err.message); }
};

function gradeAt(d) {
  const i1 = indexAtDist(d), i0 = indexAtDist(Math.max(0, d - 50));
  const dd = P[i1][4] - P[i0][4];
  return dd > 5 ? (P[i1][3] - P[i0][3]) / dd * 100 : 0;
}
function updateGhost() {
  if (!$('ghostck').checked) { ghostDist = null; ghost.remove(); $('gap').textContent = '–'; return; }
  const end = compT[compT.length - 1], gt = Math.min(rideT, end);
  let lo = 0, hi = compT.length - 1;
  while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (compT[mid] <= gt) lo = mid; else hi = mid - 1; }
  const j = Math.min(lo + 1, P.length - 1), span = compT[j] - compT[lo], f = span > 0 ? Math.min(1, (gt - compT[lo]) / span) : 0;
  ghostDist = P[lo][4] + (P[j][4] - P[lo][4]) * f;
  ghost.setLatLng([P[lo][1] + (P[j][1] - P[lo][1]) * f, P[lo][2] + (P[j][2] - P[lo][2]) * f]);
  if (!map.hasLayer(ghost)) ghost.addTo(map);
  const dGap = rideDist - ghostDist, tGap = compT[indexAtDist(rideDist)] - rideT;
  $('gap').textContent = `${dGap >= 0 ? '+' : '-'}${(Math.abs(dGap) / 1609.34).toFixed(2)} mi ${tGap >= 0 ? '+' : '-'}${fmt(Math.abs(tGap))}`;
}
function renderRide() {
  const i = indexAtDist(rideDist), j = Math.min(i + 1, P.length - 1);
  const span = P[j][4] - P[i][4], f = span > 0 ? Math.min(1, (rideDist - P[i][4]) / span) : 0;
  updateGhost();
  showPos(i, f);
  scrub.value = Math.round(rideDist / totalDist * 1e6);
  $('clock').textContent = new Date().toLocaleTimeString('en-US', { timeZone: TZ });
  $('elapsed').textContent = fmt(rideT);
  $('spd').textContent = (rideSpeed() * 2.23694).toFixed(1) + ' mph';
  $('pwr').textContent = live.power + ' W';
  $('cad').textContent = Math.round(live.cadence) + ' rpm';
  $('grade').textContent = gradeAt(rideDist).toFixed(1) + ' %';
}
function rideSpeed() {
  if (performance.now() - live.at > 3000) return 0;
  if ($('spdsrc').value === 'trainer') return live.speed;
  return live.cadence / 60 * (+$('fRing').value / +$('fCog').value) * (+$('wheel').value / 1000);
}
function rideFrame(ts) {
  if (!riding) return;
  if (rideLast !== null) {
    const dt = (ts - rideLast) / 1000;
    rideT += dt;
    rideDist = Math.min(totalDist, rideDist + rideSpeed() * dt);
  }
  rideLast = ts;
  const g = gradeAt(rideDist), sent = Math.max(-20, Math.min(20, g / gearK()));
  if (lastSent === null || Math.abs(sent - lastSent) >= 0.2 || ts - lastSendAt > 3000) {
    sendSim(sent); lastSent = sent; lastSendAt = ts;
    $('gsent').textContent = sent.toFixed(1) + ' %';
  }
  if (Math.floor(rideT) > lastSample) {
    lastSample = Math.floor(rideT);
    const i = indexAtDist(rideDist), j = Math.min(i + 1, P.length - 1), span = P[j][4] - P[i][4], f = span > 0 ? (rideDist - P[i][4]) / span : 0;
    samples.push([Date.now() / 1000, P[i][1] + (P[j][1] - P[i][1]) * f, P[i][2] + (P[j][2] - P[i][2]) * f, P[i][3] + (P[j][3] - P[i][3]) * f, rideDist, rideSpeed(), live.power, Math.round(live.cadence)]);
  }
  renderRide();
  if (rideDist >= totalDist) { finishRide(); return; }
  requestAnimationFrame(rideFrame);
}
function startRide() {
  setPlaying(false);
  if (finished) { finished = false; samples = []; rideT = 0; if (rideDist >= totalDist) rideDist = 0; }
  riding = true; rideLast = null; lastSent = null; lastSample = -1;
  if (rideDist >= totalDist) rideDist = 0;
  trail.setLatLngs([]);
  $('ridebtn').textContent = 'Pause ride'; $('finish').disabled = false; $('exportride').disabled = true;
  document.body.classList.add('riding');
  kstatus(`Riding. Grade scaled by 1/${gearK().toFixed(3)} for the ${$('fRing').value}/${$('fCog').value} feel.`);
  requestAnimationFrame(rideFrame);
}
function stopRide() {
  if (!riding) return;
  riding = false;
  if (cp) sendSim(0);
  $('ridebtn').textContent = samples.length ? 'Resume ride' : 'Start ride';
  $('finish').disabled = samples.length < 2;
  document.body.classList.remove('riding');
}
function finishRide() {
  stopRide();
  finished = true;
  ghostDist = null; ghost.remove();
  $('ridebtn').textContent = 'Start ride'; $('finish').disabled = true; $('exportride').disabled = samples.length < 2;
  const sN = samples[samples.length - 1], avgW = Math.round(samples.reduce((s, x) => s + x[6], 0) / samples.length);
  kstatus(`Finished: ${(sN[4] / 1609.34).toFixed(2)} mi in ${fmt(rideT)}, ${avgW} W avg. Export the TCX, then upload at strava.com/upload/select as a Virtual Ride.`);
}
$('ridebtn').onclick = () => riding ? stopRide() : startRide();
$('finish').onclick = finishRide;
$('ghostck').onchange = () => { if (riding || samples.length) renderRide(); else { ghostDist = null; ghost.remove(); } };

$('exportride').onclick = () => {
  const iso = t => new Date(t * 1000).toISOString();
  const s0 = samples[0], sN = samples[samples.length - 1];
  let out = `<?xml version="1.0" encoding="UTF-8"?>\n<TrainingCenterDatabase xmlns="http://www.garmin.com/xmlschemas/TrainingCenterDatabase/v2" xmlns:ns3="http://www.garmin.com/xmlschemas/ActivityExtension/v2">\n<Activities><Activity Sport="Biking"><Id>${iso(s0[0])}</Id><Notes>${esc(ride.name)} (Ride Replay, virtual)</Notes>\n<Lap StartTime="${iso(s0[0])}"><TotalTimeSeconds>${Math.round(rideT)}</TotalTimeSeconds><DistanceMeters>${sN[4].toFixed(1)}</DistanceMeters><Intensity>Active</Intensity><TriggerMethod>Manual</TriggerMethod><Track>\n`;
  for (const s of samples) {
    out += `<Trackpoint><Time>${iso(s[0])}</Time><Position><LatitudeDegrees>${s[1].toFixed(6)}</LatitudeDegrees><LongitudeDegrees>${s[2].toFixed(6)}</LongitudeDegrees></Position><AltitudeMeters>${s[3].toFixed(1)}</AltitudeMeters><DistanceMeters>${s[4].toFixed(1)}</DistanceMeters><Cadence>${s[7]}</Cadence><Extensions><ns3:TPX><ns3:Speed>${s[5].toFixed(2)}</ns3:Speed><ns3:Watts>${s[6]}</ns3:Watts></ns3:TPX></Extensions></Trackpoint>\n`;
  }
  out += `</Track></Lap></Activity></Activities>\n</TrainingCenterDatabase>\n`;
  download(out, safeName() + '_myride.tcx', 'application/vnd.garmin.tcx+xml');
  kstatus(`Exported ${samples.length} samples to ${safeName()}_myride.tcx. Upload at strava.com/upload/select and set the type to Virtual Ride.`);
};

sizeProfile();
loadRide(EMBEDDED);
</script>
</body>
</html>
